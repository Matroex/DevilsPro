a odzyskiwana przy trafieniu","healOnHitPct":"Leczenie przy trafieniu","hpRegenCombatPct":"Regeneracja HP w walce","waterDamagePct":"Obrażenia Wody","shieldPowerPct":"Siła tarcz","curseResPct":"Odporność na klątwy","lightDamagePct":"Obrażenia Światła","damageVsDebuffedPct":"Obrażenia przeciw osłabionym","darkDamagePct":"Obrażenia Ciemności","lifeStealPct":"Kradzież życia","curseChancePp":"Szansa klątwy","dotDamagePct":"Obrażenia okresowe","masterFireDevelopmentPct":"Mistrzostwo: SERCE PŁOMIENIA","masterFireCombatPct":"Mistrzostwo: WŁADCA INFERNA","masterWindDevelopmentPct":"Mistrzostwo: SERCE BURZY","masterWindCombatPct":"Mistrzostwo: WŁADCA HURAGANU","masterLightningDevelopmentPct":"Mistrzostwo: RDZEŃ BURZY","masterLightningCombatPct":"Mistrzostwo: PAN PIORUNÓW","masterEarthDevelopmentPct":"Mistrzostwo: SERCE GÓRY","masterEarthCombatPct":"Mistrzostwo: WŁADCA TWIERDZY","masterWaterDevelopmentPct":"Mistrzostwo: SERCE OCEANU","masterWaterCombatPct":"Mistrzostwo: WŁADCA PRZYPŁYWÓW","masterLightDevelopmentPct":"Mistrzostwo: SERCE ŚWIATŁA","masterLightCombatPct":"Mistrzostwo: WŁADCA ŚWIATŁA","masterDarkDevelopmentPct":"Mistrzostwo: SERCE OTCHŁANI","masterDarkCombatPct":"Mistrzostwo: WŁADCA OTCHŁANI"};
function rebirthCount(){
 const n=Number(hero?.rebirths??hero?.rebirth??hero?.odrodzenia??hero?.rebirthCount??0);
 const saved=Number(localStorage.getItem('devilsRebirths_'+(user||'guest')+'_'+(slotRaw??'none'))||0);
 return Math.max(0,Number.isFinite(n)?n:0,saved);
}
function alekQuest(){try{return JSON.parse(localStorage.getItem('devilsQuestAlek_'+(user||'guest')+'_'+(slotRaw??'none'))||'null')}catch{return null}}
function elementUnlocked(id){return !['swiatlo','ciemnosc'].includes(id)||rebirthCount()>=1}
function passiveInfo(i){const p=PASSIVES[current][i];return {name:p[0],key:p[1],step:p[2],master:MASTER_NODES.has(i)};}
function pretty(v){return Number.isInteger(v)?String(v):Number(v.toFixed(3)).toString()}
function isPp(key){return key.endsWith('Pp')}
function computedBonuses(){
 const all={},byElement={};
 for(const e of ELEMENTS){
  const bonuses={};
  PASSIVES[e.id].forEach(([name,key,step],i)=>{
   if(MASTER_NODES.has(i)&&state.main!==e.id)return;
   const lv=state.levels[e.id][i]||0;
   if(lv)bonuses[key]=Number(((bonuses[key]||0)+step*lv).toFixed(4));
  });
  byElement[e.id]=bonuses;
  for(const [k,v] of Object.entries(bonuses))all[k]=Number(((all[k]||0)+v).toFixed(4));
 }
 return {total:all,byElement};
}
function exportBonuses(){
 const computed=computedBonuses();
 localStorage.setItem(BONUS_KEY,JSON.stringify({version:2,main:state.main,rebirths:rebirthCount(),...computed,fire:computed.byElement.ogien,updatedAt:Date.now()}));
}
function treeSummary(){
 const data=computedBonuses().byElement[current];
 const entries=Object.entries(data).filter(([k,v])=>v>0);
 if(!entries.length)return 'Brak aktywnych bonusów. Kliknij pasywkę, aby sprawdzić jej działanie.';
 return entries.map(([k,v])=>(BONUS_LABELS[k]||k)+': +'+pretty(v)+(isPp(k)?' pp':'%')).join(' • ');
}
function save(){localStorage.setItem(key,JSON.stringify(state))}
function syncLevel(){if(!hero||energy===null||level===null)return;const quest=alekQuest();if(quest?.status==='completed'&&quest.element&&level>=2&&energy>=50){if(rebirthCount()===0&&state.main!==quest.element){state.main=quest.element;save()}if(!state.unlocked){state.unlocked=true;state.lastLevel=level;save()}}if(state.unlocked){if(state.lastLevel===null){state.lastLevel=level;save()}else if(level>state.lastLevel){const diff=Math.floor(level-state.lastLevel);state.mainPoints+=3*diff;state.otherPoints+=diff;state.lastLevel=level;save()}}}
// Reset drzewek tylko po WYKRYCIU nowego odrodzenia względem zapamiętanego stanu.
// Przy pierwszym uruchomieniu zapamiętujemy licznik bez kasowania istniejących pasywek.
const currentRebirth=rebirthCount();
if(state.seenRebirth===undefined||state.seenRebirth===null){state.seenRebirth=currentRebirth;save()}
else if(currentRebirth>state.seenRebirth){
 state.main=null;state.mainPoints=0;state.otherPoints=0;state.lastLevel=level;
 state.levels=Object.fromEntries(ELEMENTS.map(e=>[e.id,Array(NODES.length).fill(0)]));
 state.seenRebirth=currentRebirth;save();
}
syncLevel();
function available(i){if(alekQuest()?.status!=='completed'||!state.unlocked||!state.main||!elementUnlocked(current))return false;if(passiveInfo(i).master&&current!==state.main)return false;const incoming=EDGES.filter(edge=>edge[1]===i);return incoming.length===0||incoming.some(([from])=>state.levels[current][from]===5)}
function isMain(){return current===state.main}
function pool(){return isMain()?state.mainPoints:state.otherPoints}
function render(){const main=document.getElementById('mainElement'),others=document.getElementById('otherElements');main.innerHTML='';others.innerHTML='';const ordered=state.main?[...ELEMENTS.filter(e=>e.id===state.main),...ELEMENTS.filter(e=>e.id!==state.main)]:ELEMENTS;ordered.forEach((e,i)=>{const b=document.createElement('button');b.className='element'+(e.id===current?' active':'');b.innerHTML='<span>'+e.icon+' '+e.name+(elementUnlocked(e.id)?'':' 🔒')+'</span><small>'+state.levels[e.id].filter(v=>v===5).length+'/'+NODES.length+'</small>';b.onclick=()=>{current=e.id;render()};(state.main&&i===0?main:others).appendChild(b)});if(!state.main)main.innerHTML='<div class="muted">Nie wybrano</div>';
const e=ELEMENTS.find(e=>e.id===current);document.getElementById('treeTitle').textContent=e.icon+' '+e.name+(isMain()?' — przewodni':'');document.getElementById('pointsInfo').textContent='Punkty: '+pool()+(isMain()?' (przewodnie)':' (pozostałe)');const svg=document.getElementById('lines');svg.innerHTML='';EDGES.forEach(([a,b])=>{const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',NODES[a][0]);line.setAttribute('y1',NODES[a][1]);line.setAttribute('x2',NODES[b][0]);line.setAttribute('y2',NODES[b][1]);line.setAttribute('class','line'+(state.levels[current][a]===5?' on':''));svg.appendChild(line)});const target=document.getElementById('nodes');target.innerHTML='';NODES.forEach(([x,y],i)=>{const lv=state.levels[current][i];const info=passiveInfo(i);const b=document.createElement('button');b.className='node '+(lv===5?'complete':available(i)?'available':'locked');b.style.left=(x-22)+'px';b.style.top=(y-22)+'px';b.innerHTML='<span class="number">'+(i+1)+'</span><span>'+lv+'/5</span>';b.title=info.name+' — '+lv+'/5'+(info.master?' (MISTRZOSTWO)':'');if(info.master){b.style.borderColor='#d7a94d';b.style.boxShadow='0 0 10px #b38c42aa'}b.onclick=()=>openDialog(i);target.appendChild(b)});document.getElementById('treeSummary').textContent='Rozwinięte pasywki: '+state.levels[current].filter(v=>v===5).length+' / '+NODES.length+' • Węzły 12 i 31: mistrzostwa żywiołu przewodniego.';document.getElementById('treeSummary').textContent+=' | '+treeSummary();document.getElementById('chooseMain').classList.toggle('show',rebirthCount()>=1&&state.unlocked&&!state.main&&elementUnlocked(current));let msg='';if(!hero)msg='Nie znaleziono aktywnej postaci. Otwórz grę przez wybór postaci.';else if(energy===null||level===null)msg='Nie udało się odczytać Energii lub poziomu. System nie naliczy punktów, dopóki nie dopasujemy nazw pól w zapisie.';else if(!state.unlocked)msg='Atrybuty zablokowane: osiągnij 2. poziom i ukończ zadanie Alka. Wybór odpowiedzi ustala żywioł przewodni i daje +50 Energii oraz Rdzeń Energii.';else if(!elementUnlocked(current))msg='Światło i Ciemność odblokowują się po pierwszym odrodzeniu. Liczba odrodzeń: '+rebirthCount()+'.';else if(!state.main)msg='Ukończ zadanie Alka, aby wybrać żywioł przewodni.';const n=document.getElementById('notice');n.hidden=!msg;n.textContent=msg;document.getElementById('heroInfo').textContent='Poziom: '+(level??'?')+' • Energia: '+(energy??'?')+' • '+(state.unlocked?'Odblokowano':'Zablokowano')}
function chooseMain(){if(rebirthCount()<1||!state.unlocked||state.main||!elementUnlocked(current))return;const e=ELEMENTS.find(e=>e.id===current);if(!confirm('Wybrać '+e.name+' jako żywioł przewodni na nowe życie?'))return;state.main=current;save();render()}
function openDialog(i){
 activeNode=i;
 const lv=state.levels[current][i],info=passiveInfo(i),ok=available(i);
 document.getElementById('dialogTitle').textContent=ELEMENTS.find(e=>e.id===current).name+' — '+info.name+(info.master?' 👑':'');
 let status=lv===5?'Maksymalny poziom':!elementUnlocked(current)?'Żywioł zablokowany — wymagane pierwsze odrodzenie':info.master&&current!==state.main?'Mistrzostwo dostępne tylko dla żywiołu przewodniego':ok?'Dostępna do ulepszania':'Zablokowana — rozwiń poprzedni połączony kafelek do 5/5';
 const effect='<p><b>Efekt:</b> '+(BONUS_LABELS[info.key]||info.key)+'</p><p>Na poziom: <b>+'+pretty(info.step)+(isPp(info.key)?' pp':'%')+'</b> • Aktualnie: <b>+'+pretty(info.step*lv)+(isPp(info.key)?' pp':'%')+'</b> • Maks.: <b>+'+pretty(info.step*5)+(isPp(info.key)?' pp':'%')+'</b></p>'+(info.master?'<p class="muted">Mistrzostwo działa tylko dla żywiołu przewodniego.</p>':'');
 document.getElementById('dialogBody').innerHTML='<p>Poziom: <b>'+lv+'/5</b></p><p>'+status+'</p>'+effect+'<span class="pill">Koszt: 1 punkt</span><span class="pill">Dostępne punkty: '+pool()+'</span>';
 document.getElementById('upgradeButton').disabled=!ok||lv>=5||pool()<1||!info.key;
 document.getElementById('overlay').classList.add('show');
}
function closeDialog(){document.getElementById('overlay').classList.remove('show');activeNode=null}
function upgrade(){if(activeNode===null||!available(activeNode)||state.levels[current][activeNode]>=5||pool()<1)return;if(isMain())state.mainPoints--;else state.otherPoints--;state.levels[current][activeNode]++;save();exportBonuses();const i=activeNode;render();openDialog(i)}
function toggleMenu(){const closed=document.getElementById('sidebar').classList.toggle('closed');document.body.classList.toggle('menu-closed',closed);localStorage.setItem('idleMenuClosed',closed?'1':'0')}
if(localStorage.getItem('idleMenuClosed')==='1'){document.getElementById('sidebar').classList.add('closed');document.body.classList.add('menu-closed')}
function go(url){window.location.href=url}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});render();exportBonuses();
</script></body></html>
