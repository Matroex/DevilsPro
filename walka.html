
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moja Gra Idle — Walka</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding-left:190px;
 background:#111315;
 color:#e6dfd0;
 font-family:Arial,sans-serif;
 transition:padding-left .25s;
}

body.menu-closed{padding-left:0}

button{
 border:1px solid #80683b;
 border-radius:5px;
 background:#80683b;
 color:white;
 padding:10px 14px;
 cursor:pointer;
}

button:hover{background:#a3854d}

/* BOCZNE MENU */

.sidebar{
 position:fixed;
 top:0;
 bottom:0;
 left:0;
 width:190px;
 padding:15px 10px;
 background:#191d20;
 border-right:2px solid #80683b;
 z-index:100;
 transition:transform .25s;
}

.sidebar.closed{
 transform:translateX(-190px);
}

.sidebar h2{
 margin:12px 0 25px;
 text-align:center;
 color:#d8b66c;
 font-size:18px;
}

.menu-toggle{
 position:absolute;
 top:12px;
 right:10px;
 width:38px;
 height:38px;
 padding:0;
 font-size:22px;
}

.sidebar.closed .menu-toggle{
 right:-48px;
}

.menu-link{
 display:block;
 width:100%;
 margin-bottom:8px;
 padding:13px;
 text-align:left;
 background:#292e31;
}

.menu-link.active{
 background:#80683b;
}

/* GŁÓWNY EKRAN */

.main{
 padding:20px;
}

.battle-screen{
 max-width:1550px;
 margin:auto;
 border:2px solid #80683b;
 background:#1b1e20;
 padding:22px;
 border-radius:8px;
}

.battle-bonuses{
 text-align:right;
 color:#d8b66c;
 font-size:13px;
 margin-bottom:12px;
}

.battle-inner{
 border:1px solid #555046;
 padding:20px;
 background:#202426;
}

/* POSTAĆ */

.hero-name{
 font-size:18px;
 font-weight:bold;
 color:#e8cf92;
 margin-bottom:14px;
}

.hero-bars{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:30px;
}

.bar-label{
 font-size:13px;
 margin-bottom:7px;
}

.bar{
 height:15px;
 background:#101214;
 border:1px solid #414141;
 overflow:hidden;
 border-radius:3px;
}

.bar-fill{
 height:100%;
 width:100%;
 transition:width .3s;
}

.hp-fill{
 background:linear-gradient(90deg,#a31b28,#ff3447);
}

.mp-fill{
 background:linear-gradient(90deg,#0867a7,#21b8ff);
}

.monster-fill{
 background:linear-gradient(90deg,#6c258c,#b65ad1);
}


/* DEVILS: pasek HP z opóźnionym śladem obrażeń — bez efektów na kafelku. */
.monster-card .bar{position:relative;overflow:visible;isolation:isolate}
.monster-card .bar::before{content:"";position:absolute;inset:0;background:#101214;border-radius:2px;z-index:-1}
.monster-card .monster-trail{
 position:absolute;inset:0 auto 0 0;width:100%;
 background:linear-gradient(90deg,#b75368,#ff9c9c);
 transition:width .62s cubic-bezier(.2,.7,.25,1) .12s;
 pointer-events:none;
}
.monster-card .monster-fill{
 position:absolute;inset:0 auto 0 0;width:100%;
 transition:width .23s cubic-bezier(.2,.75,.2,1);
 will-change:width;
}
.monster-card .monster-fill.monster-hit{
 background:linear-gradient(90deg,#8530a7,#d987ee);
}
.monster-damage{
 position:absolute;left:50%;bottom:calc(100% + 5px);z-index:3;
 transform:translate(-50%,5px);color:#ffd3d3;font-size:16px;
 font-weight:bold;text-shadow:0 1px 3px #000,0 0 7px #8b2538;
 pointer-events:none;white-space:nowrap;
 animation:monster-damage-rise .75s ease-out forwards;
}
@keyframes monster-damage-rise{
 0%{opacity:0;transform:translate(-50%,6px)}
 18%{opacity:1} 75%{opacity:1}
 100%{opacity:0;transform:translate(-50%,-19px)}
}
@media(prefers-reduced-motion:reduce){
 .monster-card .monster-fill,.monster-card .monster-trail{transition:none}
 .monster-damage{animation:none;display:none}
}

/* EFEKTY */

.effects{
 display:flex;
 gap:5px;
 margin-top:12px;
 min-height:25px;
 flex-wrap:wrap;
}

.effect-slot{
 width:27px;
 height:25px;
 border:1px solid #555;
 background:#141719;
 border-radius:3px;
}

.effect-active{
 background:#574c25;
 border-color:#d8b66c;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:13px;
}

/* POTWORY */

.monsters-grid{
 display:grid;
 grid-template-columns:repeat(var(--monster-count, 1),minmax(0,1fr));
 gap:30px;
 margin-top:65px;
 margin-bottom:32px;
}

.monster-card{
 min-height:140px;
 padding:12px;
 background:#191c1e;
 border:1px solid #444;
 border-radius:6px;
}

.monster-card.empty{
 opacity:.35;
 border-style:dashed;
}

.monster-name{
 color:#e8cf92;
 font-weight:bold;
 margin-bottom:22px;
}

.monster-level{
 color:#aaa;
 font-size:12px;
 margin-top:5px;
}

.monster-card .bar{
 margin-top:6px;
}

/* DEVILS: kompaktowe, kanciaste paski jak na nagraniu. */
.bar, .monster-card .bar, .monster-card .bar::before,
.bar-fill, .monster-card .monster-fill, .monster-card .monster-trail{
 border-radius:0 !important;
}
.hero-bars .bar{
 width:100%;
 max-width:none;
 height:8px;
}
.monster-card .bar{
 width:100%;
 max-width:none;
 height:8px;
}
/* Ślad obrażeń i liczby trafień zachowują poprzednie animacje. */

/* DZIENNIK */

.combat-log{
 border:1px solid #80683b;
 margin-bottom:25px;
 background:#151819;
}

.log-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px;
 background:#292e31;
 color:#d8b66c;
 font-weight:bold;
}

.log-toggle{
 padding:5px 12px;
}

.log-content{
 height:170px;
 overflow-y:auto;
 padding:12px;
 font-size:13px;
 line-height:1.8;
}

.log-content.hidden{
 display:none;
}

.log-entry{
 border-bottom:1px solid #2c3030;
 padding:3px 0;
}

.log-player{color:#b4d8ff}
.log-enemy{color:#f3a1a1}
.log-reward{color:#d8b66c}
.log-system{color:#aaa}

/* ŁUPY */

.loot-panel{
 border:1px solid #80683b;
 background:#151819;
 padding:18px;
 min-height:125px;
}

.loot-panel h3{
 margin:0 0 12px;
 color:#d8b66c;
}

.loot-items{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
}

.loot-item{
 background:#292e31;
 border:1px solid #555;
 border-radius:5px;
 padding:10px;
 font-size:13px;
}

/* Ikony łupów i opis po najechaniu / ustawieniu fokusu */
.loot-item{position:relative;display:inline-flex;align-items:center;justify-content:center;width:58px;height:58px;padding:5px;font-size:29px;cursor:default}
.loot-item .loot-count{position:absolute;right:3px;bottom:2px;font-size:11px;color:#f2d99d;background:#151819;border-radius:3px;padding:1px 3px}
.loot-item .loot-tooltip{display:none;position:absolute;z-index:200;bottom:calc(100% + 8px);left:0;min-width:195px;max-width:280px;width:max-content;white-space:normal;text-align:left;background:#101315;border:1px solid #c4a15b;color:#e6dfd0;padding:11px;border-radius:6px;box-shadow:0 6px 20px #000b;font-size:12px;line-height:1.5;pointer-events:none}
.loot-item:hover .loot-tooltip,.loot-item:focus-visible .loot-tooltip{display:block}
.loot-item.sellable{cursor:pointer}
.loot-item.sell-selected{border:2px solid #54d675;background:#154a2a;box-shadow:0 0 10px #2bd56b66}
.loot-hint{margin:10px 0;color:#bdb4a4;font-size:12px}
.battle-summary{
 margin-top:15px;
 color:#c9bea8;
 font-size:13px;
}

.battle-footer{
 display:flex;
 justify-content:center;
 margin-top:20px;
}

.end-button{
 min-width:300px;
 font-size:15px;
 font-weight:bold;
}

/* MNIEJSZE EKRANY */

@media(max-width:1000px){
 .monsters-grid{
  gap:10px;
 }
}

@media(max-width:700px){
 body{
  padding-left:0;
 }

 .main{
  padding:60px 8px 12px;
 }

 .battle-screen{
  padding:10px;
 }

 .battle-inner{
  padding:10px;
 }

 .hero-bars{
  grid-template-columns:1fr;
  gap:14px;
 }



 .monster-card{
  min-height:110px;
 }

 .end-button{
  min-width:0;
  width:100%;
 }
}

<body data-devils-page="walka">

<!-- MENU BOCZNE -->



<main class="main">

 <div class="battle-screen">

  <div class="battle-bonuses" id="battleBonuses">
   Aktywne bonusy do walki: brak
  </div>

  <div class="battle-inner">

   <!-- POSTAĆ -->

    Nazwa postaci
   </div>

   <div class="hero-bars">

    <div>

<script>

/* =====================================
   ODCZYT WYBRANEJ POSTACI I POTWORÓW
===================================== */

const user=sessionStorage.getItem("idleLoggedUser");
const slotValue=sessionStorage.getItem("idleActiveSlot");

let savedHero=null;

if(user && slotValue!==null){

 try{
  const slots=JSON.parse(
   localStorage.getItem("idleSlots_"+user)
  );

  savedHero=slots?.[Number(slotValue)]?.hero ?? null;

 }catch(error){
  console.error("Błąd odczytu postaci:",error);
 }
}

let selectedMonsters=[];

try{
 selectedMonsters=JSON.parse(
  sessionStorage.getItem("idleSelectedMonsters") || "[]"
 );
}catch(error){
 selectedMonsters=[];
}

if(!Array.isArray(selectedMonsters)){
 selectedMonsters=[];
}

selectedMonsters=selectedMonsters.slice(0,3);

/* =====================================
   PARAMETRY TESTOWE WALKI
===================================== */

/*
 To tymczasowy system demonstracyjny.

 Nie zapisuje EXP, złota, obrażeń
 ani przedmiotów do prawdziwej postaci.

 Po dopasowaniu do index.html
 podłączymy rzeczywiste statystyki.
*/

/* DEVILS: prawdziwe dane aktywnej postaci i zapis nagród. */
const SAVE_KEY='idleSlots_'+user;
const ACTIVE_SLOT=Number(slotValue);
// Wspólny klucz z panelem postaci; odczyt przy każdej nagrodzie.
const EXP_LOCK_KEY='devilsExpLock_'+user+'_'+slotValue;
function isExpLocked(){return localStorage.getItem(EXP_LOCK_KEY)==='1';}
function numberOf(obj,keys,fallback=0){for(const key of keys){if(obj?.[key]!=null&&obj[key]!==''&&Number.isFinite(Number(obj[key])))return Number(obj[key]);}return fallback;}
function stat(name){return numberOf(savedHero?.stats,[name],0)}
const hero={
 name:savedHero?.name||savedHero?.characterClass||'Bohater',
 maxHp:Math.max(100,numberOf(savedHero,['maxHp','maxHP','hpMax','maxHealth'],100+stat('Wytrzymałość')*10)),
 hp:0,
 maxMp:Math.max(20,numberOf(savedHero,['maxMana','maxMP','manaMax','mpMax'],50+stat('Inteligencja')*5)),
 mp:0,
 attack:Math.max(5,Math.floor(10+stat('Siła')*2+numberOf(savedHero,['attack','atak'],0))),
 defense:Math.max(0,Math.floor(stat('Wytrzymałość')/2+numberOf(savedHero,['defense','obrona'],0)))
};
hero.hp=Math.min(hero.maxHp,Math.max(1,numberOf(savedHero,['hp','health','currentHp','currentHP'],hero.maxHp)));
hero.mp=Math.min(hero.maxMp,Math.max(0,numberOf(savedHero,['mana','mp','currentMana','currentMP'],hero.maxMp)));
const EXP_FIELDS=['exp','xp','experience','doswiadczenie'];
const EXP_TARGET_FIELDS=['expToNext','xpToNext','nextLevelExp','expRequired','xpRequired','expNext','nextExp','expNeeded','xpNeeded'];
function fieldOf(obj,keys,defaultKey){return keys.find(k=>obj?.[k]!==undefined&&obj?.[k]!==null)||defaultKey}
function expNeeded(level){return Math.max(1,Math.floor(100*level));}
function grantExp(character,amount){
 const expField=fieldOf(character,EXP_FIELDS,'exp');
 const levelField=fieldOf(character,['level','lvl','poziom'],'level');
 const targetField=fieldOf(character,EXP_TARGET_FIELDS,'expToNext');
 let level=Math.max(1,Math.floor(numberOf(character,[levelField],1)));
 let xp=Math.max(0,numberOf(character,[expField],0))+amount;
 let target=numberOf(character,[targetField],expNeeded(level));
 if(target<=0)target=expNeeded(level);
 let gained=0;
 while(xp>=target&&gained<1000){xp-=target;level++;gained++;target=expNeeded(level);}
 character[expField]=xp;character[levelField]=level;character[targetField]=target;
 return gained;
}
function commitRewards(exp,gold){
 if(!user||!Number.isInteger(ACTIVE_SLOT)||!savedHero)return {ok:false,reason:'Nie znaleziono aktywnej postaci.'};
 try{
  const slots=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]');
  const entry=slots[ACTIVE_SLOT];if(!entry?.hero)return {ok:false,reason:'Postać nie istnieje w zapisie.'};
  if(!Array.isArray(entry.inventory))entry.inventory=[];
  // Blokada jest odczytywana przy każdej nagrodzie, nie tylko na starcie walki.
  const awardedExp=isExpLocked()?0:exp;
  const leveled=grantExp(entry.hero,awardedExp);
  const goldField=fieldOf(entry.hero,['gold','zloto','złoto'],'gold');
  entry.hero[goldField]=numberOf(entry.hero,[goldField],0)+gold;
  localStorage.setItem(SAVE_KEY,JSON.stringify(slots));
  savedHero=entry.hero;
  window.DevilsPoints?.sync?.();
  return {ok:true,leveled,awardedExp,expLocked:awardedExp===0&&exp>0&&isExpLocked()};
 }catch(e){console.error('Błąd zapisu nagród',e);return {ok:false,reason:'Nie udało się zapisać nagród.'}}
}
let monsters=selectedMonsters.map((monster,index)=>({

 ...monster,

 battleId:index,

 maxHp:100+(Number(monster.level)||1)*40,

 hp:100+(Number(monster.level)||1)*40,

 attack:8+(Number(monster.level)||1)*3,

 exp:Number(monster.exp)||0,

 respawnTime:0

}));

let battleRunning=false;
let battleTimer=null;
let respawnTimer=null;
const GROUP_RESPAWN_MS=300;
let round=0;

let totalExp=0;
let totalGold=0;
let defeatedMonsters=0;

// Niewydane łupy trzymamy oddzielnie, aby gracz mógł zdecydować co sprzedać.
// sessionStorage chroni łupy również po przypadkowym odświeżeniu strony.
const PENDING_KEY='devilsPendingLoot_'+user+'_'+slotValue;
let pendingLoot=[];
try{const previous=JSON.parse(sessionStorage.getItem(PENDING_KEY)||'[]');if(Array.isArray(previous))pendingLoot=previous.filter(x=>x&&typeof x==='object');}catch{}
let summaryMode=false;
let rewardsFinalized=false;
function storePending(){sessionStorage.setItem(PENDING_KEY,JSON.stringify(pendingLoot));}
function salePrice(item){const explicit=Number(item.sellPrice??item.sellValue??item.vendorPrice??item.price);return Number.isFinite(explicit)&&explicit>0?Math.floor(explicit):Math.max(1,Math.floor((Number(item.level)||1)*5));}
function finalizeLoot(){
 if(rewardsFinalized)return true;
 try{
  const slots=JSON.parse(localStorage.getItem(SAVE_KEY)||'[]');const entry=slots[ACTIVE_SLOT];if(!entry?.hero)throw Error('Brak aktywnej postaci');
  if(!Array.isArray(entry.inventory))entry.inventory=[];
  const keep=pendingLoot.filter(x=>!x.sell),sold=pendingLoot.filter(x=>x.sell);
  const free=[];for(let i=0;i<400;i++)if(!entry.inventory[i])free.push(i);
  if(free.length<keep.length){addLog('Brak miejsca w ekwipunku: potrzeba '+keep.length+', wolne '+free.length+'. Zaznacz więcej łupów do sprzedaży.','system');return false;}
  keep.forEach((item,i)=>{const {sell,...data}=item;entry.inventory[free[i]]=data;});
  const gold=sold.reduce((sum,item)=>sum+salePrice(item),0);
  const goldField=fieldOf(entry.hero,['gold','zloto','złoto'],'gold');
  entry.hero[goldField]=numberOf(entry.hero,[goldField],0)+gold;
  localStorage.setItem(SAVE_KEY,JSON.stringify(slots));
  pendingLoot=[];storePending();rewardsFinalized=true;
  addLog('Do ekwipunku: '+keep.length+' szt. Sprzedano: '+sold.length+' szt. +'+gold+' złota.','reward');
  return true;
 }catch(error){console.error(error);addLog('Nie udało się zapisać łupów. Spróbuj ponownie.','system');return false;}
}


/* =====================================
   BOCZNE MENU
===================================== */

function toggleMenu(){

 const sidebar=document.getElementById("sidebar");

 const closed=sidebar.classList.toggle("closed");

 document.body.classList.toggle("menu-closed",closed);

 localStorage.setItem(
  "idleMenuClosed",
  closed?"1":"0"
 );
}

if(localStorage.getItem("idleMenuClosed")==="1"){

 document.getElementById("sidebar").classList.add("closed");

 document.body.classList.add("menu-closed");
}

/* =====================================
   EFEKTY
===================================== */

function createEmptyEffects(container){

 container.innerHTML="";

 for(let i=0;i<8;i++){

  const effect=document.createElement("div");
  effect.className="effect-slot";

  container.appendChild(effect);
 }
}

/* =====================================
   WYŚWIETLANIE POSTACI
===================================== */

function renderHero(){
 window.devilsBattleVitals={hp:hero.hp,maxHp:hero.maxHp,mp:hero.mp,maxMp:hero.maxMp};

 document.getElementById("heroName").textContent=
  hero.name;

 document.getElementById("heroHpText").textContent=
  "HP "+Math.ceil(hero.hp)+"/"+hero.maxHp;

 document.getElementById("heroMpText").textContent=
  "MP "+Math.ceil(hero.mp)+"/"+hero.maxMp;

 const hpPercent=Math.max(
  0,
  hero.hp/hero.maxHp*100
 );

 const mpPercent=Math.max(
  0,
  hero.mp/hero.maxMp*100
 );

 document.getElementById("heroHpBar").style.width=
  hpPercent+"%";

 document.getElementById("heroMpBar").style.width=
  mpPercent+"%";
}

/* =====================================
   WYŚWIETLANIE POTWORÓW
===================================== */


const monsterViews=new Map();
function showMonsterDamage(monster,damage){
 const view=monsterViews.get(monster.battleId);
 if(!view)return;
 // Każde uderzenie dostaje własną krótką liczbę, tylko nad paskiem HP.
 const number=document.createElement('span');
 number.className='monster-damage';
 number.textContent='-'+damage;
 view.bar.appendChild(number);
 number.addEventListener('animationend',()=>number.remove(),{once:true});
 // Fallback dla przeglądarek bez animacji lub przerwanej animacji.
 setTimeout(()=>number.remove(),900);
}
function renderMonsters(){
 const grid=document.getElementById('monstersGrid');
 grid.style.setProperty('--monster-count',Math.max(1,monsters.length));
 monsters.forEach(monster=>{
  let view=monsterViews.get(monster.battleId);
  if(!view){
   const card=document.createElement('div');card.className='monster-card';
   const name=document.createElement('div');name.className='monster-name';name.textContent=monster.name;
   const level=document.createElement('div');level.className='monster-level';level.textContent='Poziom '+monster.level;
   const hpText=document.createElement('div');hpText.className='bar-label';
   const bar=document.createElement('div');bar.className='bar';
   const trail=document.createElement('div');trail.className='monster-trail';
   const fill=document.createElement('div');fill.className='bar-fill monster-fill';
   bar.append(trail,fill);
   const effects=document.createElement('div');effects.className='effects';createEmptyEffects(effects);
   card.append(name,level,hpText,bar,effects);grid.appendChild(card);
   view={card,bar,hpText,fill,trail,lastHp:monster.hp,hitTimer:null};
   monsterViews.set(monster.battleId,view);
  }
  const percent=Math.max(0,Math.min(100,monster.hp/monster.maxHp*100))+'%';
  if(monster.hp<view.lastHp){
   view.fill.classList.add('monster-hit');
   clearTimeout(view.hitTimer);
   view.hitTimer=setTimeout(()=>view.fill.classList.remove('monster-hit'),190);
  }
  if(monster.hp>view.lastHp){
   // Cała grupa respawnuje jednocześnie: bez rozciągania paska od zera.
   clearTimeout(view.hitTimer);
   view.fill.classList.remove('monster-hit');
   view.fill.style.transition='none';
   view.trail.style.transition='none';
   view.fill.style.width=percent;
   view.trail.style.width=percent;
   // Odblokowanie przejścia dopiero w następnej klatce.
   requestAnimationFrame(()=>requestAnimationFrame(()=>{
    view.fill.style.transition='';
    view.trail.style.transition='';
   }));
  }else{
   view.fill.style.width=percent;
   view.trail.style.width=percent;
  }
  view.hpText.textContent=monster.hp>0
   ?'HP '+Math.ceil(monster.hp)+'/'+monster.maxHp
   :(respawnTimer!==null?'Odradzanie drużyny...':'Pokonany');
  view.lastHp=monster.hp;
 });
}

function addLog(message,type="system"){

 const log=document.getElementById("combatLog");

 const entry=document.createElement("div");

 entry.className="log-entry log-"+type;

 const time=new Date().toLocaleTimeString("pl-PL");

 entry.textContent="["+time+"] "+message;

 log.appendChild(entry);

 log.scrollTop=log.scrollHeight;

 while(log.children.length>100){
  log.firstElementChild.remove();
 }
}

function toggleLog(){

 const log=document.getElementById("combatLog");

 const hidden=log.classList.toggle("hidden");

 document.getElementById("logArrow").textContent=
  hidden?"⌄":"⌃";
}

/* =====================================
   ŁUPY — DEMONSTRACJA
===================================== */

function rollLoot(monster){
 if(!Array.isArray(monster.drops)||Math.random()>=0.3)return null;
 const options=monster.drops.filter(item=>item&&item!=='Złoto');
 if(!options.length)return null;
 const chosen=options[Math.floor(Math.random()*options.length)];
 if(typeof chosen==='string')return {name:chosen,icon:'🎒',type:'loot',source:monster.name};
 if(chosen&&typeof chosen==='object')return {...chosen,name:chosen.name||'Nieznany przedmiot',icon:chosen.icon||'🎒'};
 return null;
}

function renderLoot(){
 const container=document.getElementById('lootItems');container.innerHTML='';
 if(!pendingLoot.length){container.textContent='Na razie brak łupów.';return;}
 pendingLoot.forEach((item,index)=>{
  const tile=document.createElement(summaryMode?'button':'div');
  if(summaryMode)tile.type='button';
  tile.className='loot-item'+(summaryMode?' sellable':'')+(item.sell?' sell-selected':'');
  tile.tabIndex=0;
  const icon=document.createElement('span');icon.textContent=item.icon||'🎒';tile.appendChild(icon);
  const tip=document.createElement('span');tip.className='loot-tooltip';
  const lines=[item.name||'Przedmiot',item.description||item.desc||'Łup z potwora: '+(item.source||'nieznany'), 'Cena sprzedaży: '+salePrice(item)+' złota'];
  tip.textContent=lines.join(' • ');tile.appendChild(tip);
  tile.setAttribute('aria-label',lines.join('. '));
  if(summaryMode){tile.setAttribute('aria-pressed',String(!!item.sell));tile.onclick=()=>{item.sell=!item.sell;storePending();renderLoot();updateFinishButton();};}
  container.appendChild(tile);
 });
}
function updateFinishButton(){
 const button=document.getElementById('finishButton');
 if(!summaryMode){button.textContent='Zakończ walkę';return;}
 const count=pendingLoot.filter(x=>x.sell).length;
 button.textContent=count?'Zakończ walkę i sprzedaj łupy ('+count+')':'Zakończ walkę i zachowaj łupy';
 document.getElementById('lootHint').textContent='Kliknij ikony przedmiotów do sprzedaży (zaznaczą się na zielono). Niezaznaczone trafią do ekwipunku.';
}

function renderSummary(){

 document.getElementById("battleSummary").textContent=
  "Pokonane potwory: "+defeatedMonsters+
  " | EXP: "+totalExp+
  " | Złoto: "+totalGold+
  " (zapisane na postaci)";
}

/* =====================================
   POKONANIE POTWORA
===================================== */

function defeatMonster(monster){
 const gold=Math.max(1,Math.floor((Number(monster.level)||1)*3));
 const exp=Math.max(0,Number(monster.exp)||0);
 const item=rollLoot(monster);
 const result=commitRewards(exp,gold);
 if(!result.ok){
  addLog('Nagrody nie zostały zapisane: '+result.reason,'system');
  stopBattle();
  return;
 }
 defeatedMonsters++;
 totalExp+=result.awardedExp;
 totalGold+=gold;
 addLog('Pokonano '+monster.name+'! '+(result.expLocked?'EXP zablokowany (0)':'+'+result.awardedExp+' EXP')+', +'+gold+' złota.','reward');
 if(item){pendingLoot.push({...item,sell:false});storePending();addLog('Zdobyto przedmiot: '+item.name,'reward');renderLoot();}
 if(result.leveled)addLog('AWANS! Zdobyto '+result.leveled+' poziom(y). Punkty pasywne zostaną naliczone.','reward');
 renderSummary();
}
function battleRound(){

 if(!battleRunning){
  return;
 }

 if(hero.hp<=0){
  stopBattle();
  return;
 }

 round++;

 // Pokonane moby czekają na pozostałe; cała grupa wraca jednocześnie.
 if(monsters.every(monster=>monster.hp<=0))return;

 // Jeden atak na KAŻDEGO wybranego, żywego przeciwnika w tej samej rundzie.
 // Liczba celów wynika z wyboru na mapie (maksymalnie 3).
 const targets=monsters.filter(monster=>monster.hp>0);
 for(const target of targets){
  if(!battleRunning)break;
  const damage=Math.max(1,hero.attack+Math.floor(Math.random()*11)-5);
  target.hp=Math.max(0,target.hp-damage);
  showMonsterDamage(target,damage);
  addLog(hero.name+" atakuje "+target.name+" za "+damage+" obrażeń.","player");
  if(target.hp<=0)defeatMonster(target);
 }

 // Wszystkie żywe potwory atakują bohatera.

 monsters.forEach(monster=>{

  if(monster.hp<=0){
   return;
  }

  const damage=Math.max(
   1,
   monster.attack-hero.defense+
   Math.floor(Math.random()*5)
  );

  hero.hp=Math.max(0,hero.hp-damage);

  addLog(
   monster.name+" atakuje "+hero.name+
   " za "+damage+" obrażeń.",
   "enemy"
  );
 });

 renderHero();
 renderMonsters();

 // Respawn po 0,3 s od zabicia OSTATNIEGO potwora, bez oczekiwania na kolejną rundę.
 if(battleRunning && hero.hp>0 && monsters.length &&
    monsters.every(monster=>monster.hp<=0) && respawnTimer===null){
  respawnTimer=setTimeout(()=>{
   respawnTimer=null;
   if(!battleRunning)return;
   monsters.forEach(monster=>{monster.hp=monster.maxHp;});
   addLog('Wszystkie potwory odrodziły się jednocześnie.','system');
   renderMonsters();
  },GROUP_RESPAWN_MS);
  renderMonsters();
 }

 if(hero.hp<=0){

  addLog(
   hero.name+" został pokonany! Polowanie zatrzymane.",
   "system"
  );

  stopBattle();
 }
}

/* =====================================
   START I ZATRZYMANIE
===================================== */

function startBattle(){

 if(!savedHero){addLog("Nie znaleziono postaci. Walka nie może przyznawać nagród.","system");return;}
 if(monsters.length===0){

  addLog(
   "Nie wybrano potworów. Wróć na mapę.",
   "system"
  );

  return;
 }

 battleRunning=true;

 addLog(
  "Rozpoczęto automatyczne polowanie.",
  "system"
 );

 addLog(
  "Liczba przeciwników: "+monsters.length,
  "system"
 );

 battleTimer=setInterval(battleRound,1500);
}

function stopBattle(){

 battleRunning=false;
 if(respawnTimer!==null){clearTimeout(respawnTimer);respawnTimer=null;}

 if(battleTimer!==null){

  clearInterval(battleTimer);
  battleTimer=null;
 }
}

/* =====================================
   WYJŚCIE Z WALKI
===================================== */

function leaveBattle(page){
 stopBattle();
 // Przejście przez menu nie może powodować utraty zdobytych łupów.
 if(!finalizeLoot()){summaryMode=true;renderLoot();updateFinishButton();return;}
 if(page==='postacie.html')sessionStorage.removeItem('idleActiveSlot');
 sessionStorage.removeItem('idleSelectedMonsters');
 window.location.href=page;
}
function endBattle(){
 stopBattle();
 if(!summaryMode){
  summaryMode=true;
  addLog('Polowanie zakończone. Wybierz łupy do sprzedaży.','system');
  renderLoot();updateFinishButton();return;
 }
 leaveBattle('mapa.html');
}

renderHero();
renderMonsters();
renderSummary();
renderLoot();
updateFinishButton();

createEmptyEffects(
 document.getElementById("heroEffects")
);

startBattle();

</script>
