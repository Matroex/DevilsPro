</style></head><body data-devils-page="postac"><main class="character-page"><section class="cp-panel cp-top"><div class="cp-profile"><div class="cp-avatar" id="avatar">?</div><div><div class="cp-name" id="nick">Postać</div><div class="cp-meta"><div id="level">Poziom —</div><div id="class">Klasa —</div></div></div><div class="cp-status"><div class="cp-gender"><button type="button" class="cp-chip" id="male">Mężczyzna</button><button type="button" class="cp-chip" id="female">Kobieta</button></div><div><div class="cp-meter-label"><span>PŻ</span><span id="hpLabel">—</span></div><div class="cp-meter hp"><span id="hpFill"></span></div></div><div><div class="cp-meter-label"><span>Mana</span><span id="manaLabel">—</span></div><div class="cp-meter mana"><span id="manaFill"></span></div></div><div class="cp-location">Aktualna lokalizacja: <b id="location">Nieznana</b></div></div></div><div class="cp-exp"><div class="cp-exp-line"><strong>Doświadczenie</strong><span id="expText">—</span></div><div class="cp-meter exp"><span id="expFill"></span></div><button type="button" class="cp-lock" id="expLockBtn" aria-pressed="false"><span class="cp-lock-label">Blokada doświadczenia - <span id="expLockState">Nieaktywna</span></span></button></div></section><div class="cp-grid"><section class="cp-panel cp-basic"><h2 class="cp-title">Punkty statystyk</h2><div id="baseStats"></div></section><section class="cp-panel cp-detail"><h2 class="cp-title">Aktualne statystyki</h2><div class="cp-detail-list" id="detailStats"></div></section></div><div class="cp-lower"><section class="cp-panel cp-bottom"><h2 class="cp-title">Bonusy czasowe aktywne</h2><div class="cp-empty" id="timedBonuses">Brak aktywnych bonusów czasowych.</div></section></div><div class="cp-tooltip" id="statTooltip" role="tooltip"></div><p class="cp-notice" id="notice"></p></main><script>
(()=>{'use strict';
const user=sessionStorage.getItem('idleLoggedUser'),slot=sessionStorage.getItem('idleActiveSlot');if(!user||slot===null){location.replace('postacie.html');return}let data;try{data=JSON.parse(localStorage.getItem('idleSlots_'+user)||'[]')[Number(slot)]}catch{}if(!data?.hero){location.replace('postacie.html');return}const h=data.hero,$=id=>document.getElementById(id),num=(obj,keys)=>{for(const k of keys){const v=obj?.[k];if(v!==undefined&&v!==null&&v!==''&&Number.isFinite(Number(v)))return Number(v)}return null},str=(obj,keys)=>{for(const k of keys){const v=obj?.[k];if(typeof v==='string'&&v.trim())return v.trim()}return null},set=(id,v)=>$(id).textContent=v,fmt=n=>n===null?'—':Number(n).toLocaleString('pl-PL'),pct=(v,max)=>v!==null&&max!==null&&max>0?Math.max(0,Math.min(100,v/max*100)):0;

const classTheme=cls.toLocaleLowerCase('pl').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();document.body.classList.add(classTheme.includes('lowca')?'cp-theme-lowca':classTheme.includes('devil')?'cp-theme-devil':classTheme.includes('demon')?'cp-theme-demon':'cp-theme-lowca');

for(const [name,keys] of statKeys){const base=statValue(name,keys),equipment=bonusStat(name),temporary=effectBonus(name),totalBonus=equipment+temporary;total[name]=base+totalBonus;const info='Wartość bazowa: '+fmt(base)+'\nBonusy łącznie: '+(totalBonus>=0?'+':'')+fmt(totalBonus)+'\n• Ekwipunek: '+(equipment>=0?'+':'')+fmt(equipment)+'\n• Aktywne efekty: '+(temporary>=0?'+':'')+fmt(temporary)+'\nWynik: '+fmt(total[name]);breakdowns[name]=info;row($('baseStats'),name,fmt(total[name]),info)}

const normalized=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
function bonusIn(source,keys){if(!source||typeof source!=='object')return 0;const lookups=[source.bonuses,source.stats,source.attributes,source.effects,source];let result=0;const wanted=new Set(keys.map(normalized));for(const obj of lookups){if(!obj||typeof obj!=='object'||Array.isArray(obj))continue;for(const [k,v] of Object.entries(obj)){if(wanted.has(normalized(k))&&Number.isFinite(Number(v)))result+=Number(v)}}return result}
const activeEffects=effects.filter(e=>{const until=e?.expiresAt??e?.endTime;return e&&typeof e==='object'&&(!until||!Number.isFinite(Number(until))||Number(until)>Date.now())});
const detail=$('detailStats');detail.replaceChildren();let visible=0;
for(const [group,entries] of groups){const fragment=document.createDocumentFragment();let count=0;for(const [key,label,type,aliases=[]] of entries){if(type==='attribute'){const value=total[label]||0;if(value===0)continue;const r=document.createElement('div');r.className='cp-row';const n=document.createElement('span'),v=document.createElement('strong');n.textContent=label;v.textContent=fmt(value);v.className='cp-stat-value';v.tabIndex=0;v.dataset.breakdown=breakdowns[label];r.append(n,v);fragment.appendChild(r);count++;continue}
const keys=[key,label,...aliases];const base=bonusIn(h.bonuses,keys)+bonusIn(h.combatStats,keys);const eq=items.reduce((sum,item)=>sum+bonusIn(item,keys),0);const timed=activeEffects.reduce((sum,e)=>sum+bonusIn(e,keys),0);const value=base+eq+timed;if(Math.abs(value)<0.000001)continue;const r=document.createElement('div');r.className='cp-row';const n=document.createElement('span'),v=document.createElement('strong');n.textContent=label;v.textContent=fmt(value)+(type==='percent'?'%':'');v.className='cp-stat-value';v.tabIndex=0;v.dataset.breakdown='Wartość bazowa / stała: '+fmt(base)+'\nEkwipunek: '+(eq>=0?'+':'')+fmt(eq)+'\nAktywne efekty: '+(timed>=0?'+':'')+fmt(timed)+'\nRazem: '+fmt(value)+(type==='percent'?'%':'');r.append(n,v);fragment.appendChild(r);count++}
if(count){const title=document.createElement('h3');title.className='cp-section';title.textContent=group;detail.append(title,fragment);visible+=count}}
