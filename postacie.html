<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devils — Wybór postaci</title>
<style>
:root{--gold:#aa8439;--goldlight:#ecd3a0;--ink:#eee0c8}
*{box-sizing:border-box}
html{min-height:100%;background:#080707}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background:linear-gradient(180deg,#8b3025 0%,#6f241d 14%,#411a17 33%,#1a1010 59%,#090909 85%,#070707 100%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 45% at 50% 1%,#d452322a,transparent 80%),linear-gradient(90deg,#0003,transparent 20%,transparent 80%,#0003)}
.shell{position:relative;width:min(1530px,calc(100% - 56px));margin:24px auto 48px;min-height:620px;padding:24px 26px 36px;background:transparent}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
h1{font-size:clamp(32px,3.5vw,49px);font-variant:small-caps;letter-spacing:2px;color:#f5e7d2;margin:0 0 6px;text-shadow:0 2px 6px #0007}
.intro{margin:5px 0;font-size:15px;color:#dfc3ad}
button{font-family:Georgia,'Times New Roman',serif;cursor:pointer;transition:background .18s,border-color .18s,transform .18s,box-shadow .18s}
.btn{position:relative;border:1px solid #987333;background:linear-gradient(180deg,#282118,#13100e 65%,#21180e);color:#ecd6a4;font-weight:bold;padding:10px 12px;box-shadow:inset 0 0 0 2px #100e0b,inset 0 0 0 3px #775927,0 2px 6px #0005;text-shadow:0 1px 2px #000}
.btn:hover{background:linear-gradient(#49311d,#24180f);border-color:#e0b768;color:#fff0c8;box-shadow:inset 0 0 0 2px #140d07,inset 0 0 0 3px #b68a3c,0 0 16px #d59b3d55;transform:translateY(-1px)}
.logout{min-width:105px;white-space:nowrap}
.counter{margin:72px 0 22px;font-size:15px;color:#f0d3a4;border-bottom:1px solid #d6a44b40;padding-bottom:14px}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.slot{position:relative;isolation:isolate;min-width:0;min-height:380px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 11px 14px;border:1px solid #92702f;background:linear-gradient(160deg,#241a18 0%,#140e0e 50%,#0e0b0b 100%);box-shadow:inset 0 0 0 3px #090807,inset 0 0 0 4px #66502955,0 9px 23px #0007;transition:border-color .2s,background .2s,box-shadow .2s,transform .2s}
.slot:before,.slot:after{position:absolute;color:#c09a51;font-size:21px;line-height:1;pointer-events:none;text-shadow:0 0 6px #b4824388}
.slot:before{content:'❧';top:3px;left:5px;transform:rotate(-35deg)}
.slot:after{content:'❧';bottom:3px;right:5px;transform:rotate(145deg)}
.slot:hover{border-color:#e2b969;background:linear-gradient(160deg,#33201b,#1b1110 55%,#110b0b);box-shadow:inset 0 0 0 3px #090807,inset 0 0 0 4px #b08a3c88,0 0 22px #d47a3344;transform:translateY(-3px)}
.avatar{width:100px;height:100px;display:grid;place-items:center;margin:0 0 18px;border:1px solid #b38b43;background:linear-gradient(180deg,#201b14,#090909 75%);color:#f3dba5;font-size:53px;font-weight:bold;text-shadow:0 2px 8px #000;box-shadow:inset 0 0 0 4px #0b0b0b,inset 0 0 0 5px #80642d,0 0 0 4px #090808}
.avatar.empty{color:#b49b73;font-size:36px}
.name{font-size:18px;font-weight:bold;color:#f3e7d2;overflow-wrap:anywhere;max-width:100%;margin:0 0 12px;min-height:24px;text-shadow:0 2px 3px #000}
.meta{font-size:14px;color:#dfbf83;line-height:1.75;margin:0}
.actions{width:100%;display:grid;gap:9px;margin-top:auto;padding-top:20px;border-top:1px solid #a67c3c44}
.actions .btn{width:100%;font-size:13px}
.btn.delete{color:#e5b6b3;border-color:#7e503d;background:linear-gradient(#281914,#180e0d)}
.btn.delete:hover{color:#ffe0d4;border-color:#c17a59;background:linear-gradient(#4c211a,#29130f)}
.empty-label{color:#c7a8a0;font-size:13px;line-height:1.5;margin:5px 0 0}
@media(max-width:1120px){.slots{grid-template-columns:repeat(3,minmax(0,1fr))}.counter{margin-top:45px}}
@media(max-width:680px){.shell{width:calc(100% - 20px);padding:20px 8px}.slots{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.slot{min-height:330px;padding:18px 8px 12px}.avatar{width:78px;height:78px;font-size:42px}.name{font-size:16px}.counter{margin-top:35px}}
@media(max-width:370px){.slots{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){button,.slot{transition:none}}
</style>
</head>
<body>
<main class="shell">
 <div class="top">
  <div>
   <h1>DEVILS</h1>
   <p class="intro">Wybierz swoją postać</p>
   <p class="intro">Wybierz bohatera lub stwórz nową postać, aby wejść do gry.</p>
  </div>
  <button class="btn logout" onclick="logout()">Wyloguj</button>
 </div>
 <div class="counter" id="slotCounter">Sloty postaci: 0/5</div>
 <section id="slots" class="slots" aria-label="Sloty postaci"></section>
</main>
<script>
const user=sessionStorage.getItem('idleLoggedUser');
if(!user)window.location.replace('login.html');
const SLOTS_KEY='idleSlots_'+user;
const OLD_SAVE_KEY='idleCharacter_'+user;
function getSlots(){
 try{const saved=JSON.parse(localStorage.getItem(SLOTS_KEY));if(Array.isArray(saved))return Array.from({length:5},(_,i)=>saved[i]||null);}catch(e){}
 return [null,null,null,null,null];
}
function saveSlots(slots){localStorage.setItem(SLOTS_KEY,JSON.stringify(slots));}
function migrateOldCharacter(){
 if(localStorage.getItem(SLOTS_KEY)!==null)return;
 const slots=getSlots();const old=localStorage.getItem(OLD_SAVE_KEY);
 if(old){try{const data=JSON.parse(old);if(data.hero)slots[0]={hero:data.hero,inventory:data.inventory||[]};}catch(e){}}
 saveSlots(slots);
}
function make(tag,cls,value){const el=document.createElement(tag);if(cls)el.className=cls;if(value!==undefined)el.textContent=value;return el;}
function renderSlots(){
 const slots=getSlots();const container=document.getElementById('slots');container.replaceChildren();
 document.getElementById('slotCounter').textContent='Sloty postaci: '+slots.filter(s=>s&&s.hero).length+'/5';
 slots.forEach((character,index)=>{
  const box=make('article','slot');const hero=character&&character.hero;
  const nick=hero?String(hero.nick||hero.nickname||hero.name||hero.characterName||hero.nazwa||hero.characterClass||'Postać'):'';
  const avatar=make('div','avatar'+(hero?'':' empty'),hero?(Array.from(nick.trim())[0]||'?').toLocaleUpperCase('pl-PL'):'+');
  avatar.setAttribute('aria-label',hero?'Awatar '+nick:'Pusty slot');box.appendChild(avatar);
  if(hero){
   box.appendChild(make('div','name',nick));
   box.appendChild(make('p','meta','Poziom '+(hero.level??hero.lvl??1)));
   box.appendChild(make('p','meta','Klasa: '+(hero.characterClass||hero.klasa||'Nieznana')));
   const actions=make('div','actions');
   const play=make('button','btn','Wejdź do gry');play.onclick=()=>enterGame(index);actions.appendChild(play);
   const del=make('button','btn delete','Usuń postać');del.onclick=()=>deleteCharacter(index);actions.appendChild(del);
   box.appendChild(actions);
  }else{
   box.appendChild(make('div','name','Pusty slot'));
   box.appendChild(make('p','empty-label','Stwórz nowego bohatera i rozpocznij przygodę.'));
   const actions=make('div','actions');const create=make('button','btn','Stwórz postać');create.onclick=()=>enterGame(index);actions.appendChild(create);box.appendChild(actions);
  }
  container.appendChild(box);
 });
}
function enterGame(index){
 const slots=getSlots();sessionStorage.setItem('idleActiveSlot',String(index));
 window.location.href=slots[index]&&slots[index].hero?'pulpit.html':'index.html';
}
function deleteCharacter(index){
 const slots=getSlots();const character=slots[index];if(!character||!character.hero)return;
 const hero=character.hero;const label=hero.nick||hero.nickname||hero.name||hero.characterClass||'postać';
 if(!confirm('Czy na pewno usunąć '+label+'?'))return;
 if(prompt('Aby trwale usunąć postać, wpisz USUŃ:')!=='USUŃ')return;
 slots[index]=null;saveSlots(slots);renderSlots();
}
function logout(){sessionStorage.removeItem('idleLoggedUser');sessionStorage.removeItem('idleActiveSlot');window.location.href='login.html';}
migrateOldCharacter();renderSlots();
</script>
</body>
</html>
